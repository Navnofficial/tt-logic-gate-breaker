# Tiny Tapeout project information
project:
  title:        "NanoTrace-4 — 4-Channel Hardware Logic Analyzer"
  author:       "Naveen"
  discord:      "naveen2898"
  description:  "4-channel hardware logic analyzer with real-time VGA waveform display, trigger system, glitch detection, and gamepad controls. Racing-the-beam rendering on 130nm ASIC — no framebuffer."
  language:     "Verilog"
  clock_hz:     25175000

  tiles: "1x1"

  top_module:  "tt_um_logic_gate_breaker"

  source_files:
    - "tt_um_logic_gate_breaker.v"
    - "vga_timing.v"
    - "sampler.v"
    - "renderer.v"
    - "pixel_font.v"
    - "trigger.v"
    - "glitch_detect.v"
    - "gamepad.v"
    - "boot_anim.v"

pinout:
  # Inputs
  ui[0]: "CH1 - Digital signal input 1"
  ui[1]: "CH2 - Digital signal input 2"
  ui[2]: "CH3 - Digital signal input 3"
  ui[3]: "CH4 - Digital signal input 4"
  ui[4]: "Gamepad Up - select previous channel"
  ui[5]: "Gamepad Down - select next channel"
  ui[6]: "Gamepad Left - zoom out timescale"
  ui[7]: "Gamepad Right - zoom in timescale"

  # Outputs (TinyVGA PMOD standard)
  uo[0]: "R1 - Red bit 1 (MSB)"
  uo[1]: "G1 - Green bit 1 (MSB)"
  uo[2]: "B1 - Blue bit 1 (MSB)"
  uo[3]: "vsync"
  uo[4]: "R0 - Red bit 0 (LSB)"
  uo[5]: "G0 - Green bit 0 (LSB)"
  uo[6]: "B0 - Blue bit 0 (LSB)"
  uo[7]: "hsync"

  # Bidirectional pins (unused)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6